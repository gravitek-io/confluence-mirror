# Continuous integration: build the core package, run its unit tests and
# check dependencies for known high-severity advisories.
# Runs on every pull request and on pushes to main, on the supported Node
# range (22 = minimum in "engines", 26 = version pinned in .nvmrc).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm test
      # Advisories do not depend on the Node version: check once only.
      - name: Audit dependencies
        if: matrix.node-version == 26
        run: npm audit --audit-level=high
